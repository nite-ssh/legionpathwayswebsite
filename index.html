<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Under Construction</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
  }

  body {
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: linear-gradient(135deg, #1e1b2e 0%, #2d1b3d 50%, #1a1a2e 100%);
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    color: #f5f3ff;
    text-align: center;
    overflow: hidden;
  }

  .container {
    padding: 2rem;
    max-width: 600px;
  }

  .icon {
    font-size: 4rem;
    margin-bottom: 1.5rem;
    animation: bounce 2s ease-in-out infinite;
  }

  @keyframes bounce {
    0%, 100% { transform: translateY(0); }
    50% { transform: translateY(-15px); }
  }

  h1 {
    font-size: 2.5rem;
    margin-bottom: 1rem;
    background: linear-gradient(90deg, #a78bfa, #f472b6);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
  }

  p {
    font-size: 1.1rem;
    color: #cbd5e1;
    margin-bottom: 2rem;
    line-height: 1.6;
  }

  .progress-bar {
    width: 100%;
    height: 10px;
    background: rgba(255, 255, 255, 0.1);
    border-radius: 10px;
    overflow: hidden;
    margin-bottom: 1.5rem;
  }

  .progress-fill {
    height: 100%;
    width: 65%;
    background: linear-gradient(90deg, #a78bfa, #f472b6);
    border-radius: 10px;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.7; }
  }

  .socials {
    display: flex;
    justify-content: center;
    gap: 1rem;
    margin-top: 1.5rem;
  }

  .socials a {
    color: #f5f3ff;
    text-decoration: none;
    font-size: 0.9rem;
    padding: 0.5rem 1rem;
    border: 1px solid rgba(255, 255, 255, 0.2);
    border-radius: 20px;
    transition: all 0.3s ease;
  }

  .socials a:hover {
    background: rgba(255, 255, 255, 0.1);
    border-color: #a78bfa;
  }

  footer {
    margin-top: 2rem;
    font-size: 0.85rem;
    color: #9ca3af;
  }
</style>
</head>
<body>
  <div class="container">
    <div class="icon">🚧</div>
    <h1>Under Construction</h1>
    <p>We're working hard to bring you something great. Please check back soon!</p>
    <div class="progress-bar">
      <div class="progress-fill"></div>
    </div>
    <div class="socials">
      <a href="#">Twitter</a>
      <a href="#">Instagram</a>
      <a href="#">Contact</a>
    </div>
    <footer>&copy; 2026 Your Company. All rights reserved.</footer>
  </div>
</body>
</html>
